[project]
name = "gymops"
version = "0.1.0"
description = "GymOps — gym management system"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1,<6.2",
    "django-environ>=0.14.0",
    "psycopg[binary]>=3.3.4",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
